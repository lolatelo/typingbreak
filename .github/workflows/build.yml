name: Build Typing Break Reminder (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconsole --onefile --name TypingBreakReminder TypingBreakReminder.py
      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingBreakReminder
          path: dist/TypingBreakReminder.exe
